<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker App</title>

</head>

<body>
  <div id="habit-container" class="container">
    <h4>Habit list container</h4>
  </div>

  <div id="menu-container" class="container g-20">
    <button id="null-button" class="debug-button">
      <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 256 256">
        <path
          d="M203.63,62.65l13.25-14.58a12,12,0,0,0-17.76-16.14L185.88,46.49A100,100,0,0,0,52.37,193.35L39.12,207.93a12,12,0,1,0,17.76,16.14l13.24-14.56A100,100,0,0,0,203.63,62.65ZM52,128A75.94,75.94,0,0,1,169.58,64.43l-100.91,111A75.6,75.6,0,0,1,52,128Zm76,76a75.52,75.52,0,0,1-41.58-12.43l100.91-111A75.94,75.94,0,0,1,128,204Z">
        </path>
      </svg>
    </button>
    <button id="show-habitreg">
      <svg xmlns="http://www.w3.org/2000/svg" width="75" height="75" viewBox="0 0 256 256">
        <path
          d="M228,128a12,12,0,0,1-12,12H140v76a12,12,0,0,1-24,0V140H40a12,12,0,0,1,0-24h76V40a12,12,0,0,1,24,0v76h76A12,12,0,0,1,228,128Z">
        </path>
      </svg>
    </button>
    <button id="clear-all" class="debug-button">
      <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 256 256">
        <path
          d="M208.49,191.51a12,12,0,0,1-17,17L128,145,64.49,208.49a12,12,0,0,1-17-17L111,128,47.51,64.49a12,12,0,0,1,17-17L128,111l63.51-63.52a12,12,0,0,1,17,17L145,128Z">
        </path>
      </svg>
    </button>
  </div>

  <div id="habitreg-container" class="container g-10">
    <h4>Novo Habito</h4>
    <label class="g-10">
      <p>Nome:</p><input type="text" id="habit-name">
    </label>
    <button id="add-habit" class="submit">Adicionar habito</button>
  </div>

  <script src="/main.js"></script>
</body>

</html>
