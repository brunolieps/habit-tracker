<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker App</title>

</head>

<body>
  <div id="habit-container" class="container">
    <h4>Habit list container</h4>
  </div>

  <div id="menu-container" class="container">

      <svg xmlns="http://www.w3.org/2000/svg" width="75" height="75" viewBox="0 0 256 256">
        <path
          d="M228,128a12,12,0,0,1-12,12H140v76a12,12,0,0,1-24,0V140H40a12,12,0,0,1,0-24h76V40a12,12,0,0,1,24,0v76h76A12,12,0,0,1,228,128Z">

      </svg>
    </button>
    <button id="clear-all" class="debug-button">
      <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 256 256">
        <path
          d="M208.49,191.51a12,12,0,0,1-17,17L128,145,64.49,208.49a12,12,0,0,1-17-17L111,128,47.51,64.49a12,12,0,0,1,17-17L128,111l63.51-63.52a12,12,0,0,1,17,17L145,128Z">

  <script src="/main.js"></script>

</html>
